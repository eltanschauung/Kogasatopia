// STV demos
tv_enable 1
tv_autorecord 0 // SourceTVManager will handle this

// Dont let people use it as a public spectator server
tv_maxclients 0

// Halloween motd
motdfile motd2.txt

// Kogasa plugins
sm_saysounds_forced_groups "unreal,tf2"
sv_hudhint_sound 0
tf_bison_tick_time 0.01

//Reserved slots/queue system
sv_visiblemaxplayers 24

// Fixes the !rank listener
sm plugins unload mge

// Welcomemsg
sm_welcomemsg_welcome1 "{pp}Welcome to {g}kogasa.tf{pp} %N!"
sm_wsmg_news "{g}News: {d}Upgraded {g}!hats{d} to use the interactive MoTD backpack, made the mapcycle big again, added new Blue Archive hats, added Mandrill Maze, nerfed Jump Pads for Heavy/Sniper"
sm_welcomemsg_info1 "{lg}We have buffs for bad weapons, use {g}!r{lg} to see the changes"
sm_welcomemsg_info2 "{lg}We have new weapons entirely, use {g}!c{lg} to see stats and equip"
sm_welcomemsg_info3 "{lg}Random crits and bullet spread are disabled,"
sm_welcomemsg_info4 "{lg}Visit our group with {g}!steam{lg} to learn more and see when people are playing."
sm_welcomemsg_rules1 "{g}1. No hackers"
sm_welcomemsg_rules2 "{g}2. No friendlies/play the fucking game!"
sm_welcomemsg_rules3 "{g}3. Use common sense and be civil "
sm_welcomemsg_rules4 "{g}4. Nigger"

mp_teams_unbalance_limit 1
mp_autoteambalance 0

mp_idledealmethod 0    // Nothing
mp_scrambleteams_auto 0

// Execute Banned Users //
exec banned_user.cfg
exec banned_ip.cfg
writeid
writeip

// FastDL url
sv_downloadurl "http://fastdl.kogasa.tf/tf2"
